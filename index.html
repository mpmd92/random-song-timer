<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Not quite my timer...</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🕐</text></svg>">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#070504">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root {
    /* Sampled from the header image: near-black, dark brown, warm amber. */
    --bg: #070504;
    --panel: #16100a;
    --panel-2: #241a11;
    --border: #402a16;
    --text: #f5e8d7;
    --muted: #b0906c;
    --accent: #f0a92c;
    --accent-2: #c07f2c;
    --good: #f2c552;
    --error: #d4562d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 48px 24px;
    position: relative;
  }
  .bg {
    position: fixed;
    inset: 0;
    z-index: -1;
    overflow: hidden;
    background: #050302;
  }
  .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(110px);
    opacity: 0.5;
    animation: drift 28s ease-in-out infinite alternate;
    will-change: transform;
  }
  .blob-a {
    width: 560px; height: 560px;
    top: -180px; left: -160px;
    background: radial-gradient(circle, var(--accent), transparent 70%);
  }
  .blob-b {
    width: 600px; height: 600px;
    bottom: -200px; right: -180px;
    background: radial-gradient(circle, var(--accent-2), transparent 70%);
    animation-delay: -9s;
  }
  .blob-c {
    width: 440px; height: 440px;
    top: 45%; left: 58%;
    background: radial-gradient(circle, var(--good), transparent 70%);
    animation-delay: -18s;
  }
  @keyframes drift {
    0%   { transform: translate(0, 0) scale(1); }
    50%  { transform: translate(50px, -40px) scale(1.1); }
    100% { transform: translate(-40px, 30px) scale(0.94); }
  }
  .card {
    width: 100%;
    max-width: 440px;
    background: rgba(22, 16, 10, 0.86);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 28px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }
  h1 {
    font-family: "Marker Felt", "Chalkboard SE", "Comic Sans MS", cursive;
    font-size: 34px;
    font-weight: 700;
    margin: 0 0 18px;
    text-align: center;
    letter-spacing: 0.5px;
    color: var(--text);
  }
  .hero {
    display: block;
    width: 100%;
    border-radius: 12px;
    margin: 0 0 18px;
  }
  .clock {
    text-align: center;
    font-variant-numeric: tabular-nums;
    font-size: 56px;
    font-weight: 700;
    letter-spacing: 1px;
    margin: 8px 0 2px;
  }
  .ends-at {
    text-align: center;
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    min-height: 16px;
    margin-bottom: 14px;
  }
  .duration-row {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin-bottom: 16px;
  }
  .duration-row button {
    flex: 1;
    padding: 8px 0;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--muted);
    font-size: 13px;
    cursor: pointer;
  }
  .duration-row button:hover { color: var(--text); border-color: var(--accent-2); }
  .duration-row button.active { color: var(--text); border-color: var(--accent); background: #38240f; }
  .custom-duration {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin-bottom: 20px;
  }
  .custom-duration input {
    width: 52px;
    text-align: center;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: 6px 4px;
    font-size: 14px;
  }
  .custom-duration span { color: var(--muted); font-size: 13px; }
  .controls {
    display: flex;
    gap: 10px;
    margin-bottom: 8px;
  }
  .controls button {
    flex: 1;
    padding: 12px 0;
    border-radius: 12px;
    border: none;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  #startBtn { background: var(--accent); color: #1c1206; }
  #startBtn:hover { background: #ffc04d; }
  #resetBtn { background: var(--panel-2); color: var(--text); border: 1px solid var(--border); }
  #resetBtn:hover { border-color: var(--accent-2); }
  .status {
    min-height: 18px;
    text-align: center;
    font-size: 13px;
    color: var(--muted);
    margin: 14px 0 4px;
  }
  .status.error { color: var(--error); }
  .status.good { color: var(--good); }
  .settings-section {
    margin-top: 18px;
    border-top: 1px solid var(--border);
    padding-top: 14px;
  }
  .settings-title {
    font-size: 13px;
    color: var(--muted);
    margin: 0 0 14px;
  }
  .settings-body { display: flex; flex-direction: column; gap: 12px; }
  label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 6px; }
  input[type="text"] {
    width: 100%;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: 9px 10px;
    font-size: 13px;
  }
  input[type="range"] { width: 100%; }
  .save-row { display: flex; gap: 8px; align-items: center; }
  .save-row button {
    padding: 8px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--text);
    font-size: 13px;
    cursor: pointer;
  }
  .save-row button:hover { border-color: var(--accent-2); }
  .player-wrap {
    margin-top: 16px;
    display: none;
  }
  .player-wrap.visible { display: block; }
  #player { width: 100%; aspect-ratio: 16/9; border-radius: 10px; overflow: hidden; }
  .player-controls { display: flex; gap: 8px; margin-top: 8px; }
  .player-controls button {
    flex: 1;
    padding: 8px 0;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--text);
    font-size: 12px;
    cursor: pointer;
  }
  .player-controls button:hover { border-color: var(--accent-2); }

  /* On desktop the card widens so the video sits at a normal embed size, while
     the timer controls stay in a centered column rather than stretching. */
  @media (min-width: 820px) {
    .card { max-width: 780px; }
    h1 { font-size: 40px; }
    .clock,
    .ends-at,
    .duration-row,
    .custom-duration,
    .controls,
    .status,
    .settings-section {
      max-width: 460px;
      margin-left: auto;
      margin-right: auto;
    }
  }
</style>
</head>
<body>

<div class="bg" aria-hidden="true">
  <span class="blob blob-a"></span>
  <span class="blob blob-b"></span>
  <span class="blob blob-c"></span>
</div>

<div class="card">
  <h1>Not quite my timer...</h1>
  <img class="hero" src="whiplash.jpg" alt="A conductor wincing at a stopwatch held out toward him">

  <div class="clock" id="clock">1:00:00</div>
  <div class="ends-at" id="endsAt"></div>

  <div class="duration-row" id="presets">
    <button data-sec="300">5m</button>
    <button data-sec="900">15m</button>
    <button data-sec="3600" class="active">1h</button>
  </div>

  <div class="custom-duration">
    <input type="number" id="minInput" min="0" max="240" value="60">
    <span>min</span>
    <input type="number" id="secInput" min="0" max="59" value="0">
    <span>sec</span>
  </div>

  <div class="controls">
    <button id="startBtn">Start</button>
    <button id="resetBtn">Reset</button>
  </div>

  <div class="status" id="status">Add a YouTube playlist below, then hit Start.</div>

  <audio id="keepAlive" src="keepalive.wav" loop preload="auto" playsinline></audio>

  <div class="player-wrap" id="playerWrap">
    <div id="player"></div>
    <div class="player-controls">
      <button id="skipBtn">🔀 Another random song</button>
    </div>
  </div>

  <div class="settings-section">
    <p class="settings-title">Playlist</p>
    <div class="settings-body">
      <div>
        <label for="playlistInput">YouTube / YouTube Music playlist link or ID</label>
        <input type="text" id="playlistInput" placeholder="https://music.youtube.com/playlist?list=PL...">
      </div>
      <div class="save-row">
        <button id="saveBtn">Save &amp; load playlist</button>
        <button id="testBtn">Test random song</button>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  const clockEl = document.getElementById('clock');
  const endsAtEl = document.getElementById('endsAt');
  const startBtn = document.getElementById('startBtn');
  const resetBtn = document.getElementById('resetBtn');
  const statusEl = document.getElementById('status');
  const minInput = document.getElementById('minInput');
  const secInput = document.getElementById('secInput');
  const presets = document.getElementById('presets');
  const playlistInput = document.getElementById('playlistInput');
  const saveBtn = document.getElementById('saveBtn');
  const testBtn = document.getElementById('testBtn');
  const playerWrap = document.getElementById('playerWrap');
  const skipBtn = document.getElementById('skipBtn');

  const DEFAULT_VOLUME = 70;
  const STORAGE_KEY = 'randomSongTimer.settings.v1';
  let settings = { playlistId: '' };
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    settings = Object.assign(settings, saved);
  } catch (e) {}

  if (settings.playlistId) playlistInput.value = settings.playlistId;

  let remainingMs = 60 * 60 * 1000;
  let endTime = null;
  let intervalId = null;
  let alarmId = null;
  let running = false;
  const keepAliveAudio = document.getElementById('keepAlive');

  let player = null;
  let playerReady = false;
  let playlistLoaded = false;
  let primed = false;
  let autoStartOnLoad = false;

  function persist() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(settings));
  }

  function formatTime(s) {
    const h = Math.floor(s / 3600);
    const m = Math.floor((s % 3600) / 60).toString().padStart(2, '0');
    const sec = Math.floor(s % 60).toString().padStart(2, '0');
    return h > 0 ? h + ':' + m + ':' + sec : m + ':' + sec;
  }

  function currentRemainingMs() {
    if (running && endTime !== null) return Math.max(0, endTime - Date.now());
    return Math.max(0, remainingMs);
  }

  function updateClock() {
    const secs = Math.ceil(currentRemainingMs() / 1000);
    clockEl.textContent = formatTime(secs);
    document.title = running ? formatTime(secs) + ' — Not quite my timer...' : 'Not quite my timer...';
    if (running && endTime !== null) {
      const at = new Date(endTime);
      endsAtEl.textContent = 'Ends at ' + at.getHours().toString().padStart(2, '0') + ':' +
        at.getMinutes().toString().padStart(2, '0') + ':' + at.getSeconds().toString().padStart(2, '0');
    } else {
      endsAtEl.textContent = '';
    }
  }

  function setStatus(msg, kind) {
    statusEl.textContent = msg;
    statusEl.className = 'status' + (kind ? ' ' + kind : '');
  }

  function readDurationFromInputs() {
    const m = Math.max(0, Math.min(240, Number(minInput.value) || 0));
    const s = Math.max(0, Math.min(59, Number(secInput.value) || 0));
    return m * 60 + s;
  }

  presets.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-sec]');
    if (!btn) return;
    [...presets.children].forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const sec = Number(btn.dataset.sec);
    minInput.value = Math.floor(sec / 60);
    secInput.value = sec % 60;
    if (!running) {
      remainingMs = readDurationFromInputs() * 1000;
      updateClock();
    }
  });

  [minInput, secInput].forEach(inp => inp.addEventListener('change', () => {
    [...presets.children].forEach(b => b.classList.remove('active'));
    if (!running) {
      remainingMs = readDurationFromInputs() * 1000;
      updateClock();
    }
  }));

  function extractPlaylistId(raw) {
    const value = raw.trim();
    if (!value) return '';
    try {
      const url = new URL(value);
      const listParam = url.searchParams.get('list');
      if (listParam) return listParam;
    } catch (e) {
      // not a URL, treat as raw ID
    }
    return value;
  }

  function ensurePlayer(cb) {
    if (playerReady) { cb(); return; }
    const check = setInterval(() => {
      if (playerReady) {
        clearInterval(check);
        cb();
      }
    }, 150);
  }

  window.onYouTubeIframeAPIReady = function () {
    player = new YT.Player('player', {
      playerVars: { autoplay: 0, controls: 1, rel: 0, modestbranding: 1 },
      events: {
        onReady: () => {
          playerReady = true;
          if (settings.playlistId) {
            autoStartOnLoad = true;
            loadPlaylist(settings.playlistId, true);
          }
        },
        onError: () => {
          setStatus('YouTube reported an error loading that video/playlist.', 'error');
        }
      }
    });
  };

  function loadPlaylist(id, silent) {
    ensurePlayer(() => {
      playlistLoaded = false;
      player.cuePlaylist({ listType: 'playlist', list: id });
      if (!silent) setStatus('Loading playlist…');
      const checkLoaded = setInterval(() => {
        const list = player.getPlaylist();
        if (list && list.length > 0) {
          clearInterval(checkLoaded);
          clearTimeout(failTimer);
          playlistLoaded = true;
          setStatus(`Playlist ready — ${list.length} songs loaded.`, 'good');
          if (autoStartOnLoad) {
            autoStartOnLoad = false;
            playRandomSongOnLoad();
          }
        }
      }, 400);
      const failTimer = setTimeout(() => {
        clearInterval(checkLoaded);
        if (!playlistLoaded) {
          setStatus('Couldn’t load that playlist. Double-check it’s Public or Unlisted, not Private, and that the link/ID is correct.', 'error');
        }
      }, 7000);
    });
  }

  saveBtn.addEventListener('click', () => {
    const id = extractPlaylistId(playlistInput.value);
    if (!id) {
      setStatus('Paste a playlist link or ID first.', 'error');
      return;
    }
    settings.playlistId = id;
    persist();
    loadPlaylist(id, false);
  });

  function primeAutoplay(cb) {
    if (primed) { cb && cb(); return; }
    ensurePlayer(() => {
      try {
        player.mute();
        player.playVideo();
        setTimeout(() => {
          player.pauseVideo();
          player.seekTo(0, true);
          primed = true;
          cb && cb();
        }, 250);
      } catch (e) {
        primed = true;
        cb && cb();
      }
    });
  }

  function playRandomSong() {
    if (!playerReady) {
      setStatus('Player is still loading, try again in a moment.', 'error');
      return;
    }
    if (!playlistLoaded) {
      setStatus('No playlist loaded yet — add one below.', 'error');
      return;
    }
    const list = player.getPlaylist();
    if (!list || list.length === 0) {
      setStatus('Playlist appears empty.', 'error');
      return;
    }
    const idx = Math.floor(Math.random() * list.length);
    playerWrap.classList.add('visible');
    player.unMute();
    player.setVolume(DEFAULT_VOLUME);
    // Starting playback makes the browser scroll the iframe into view, which
    // would yank the page down past the title. Put the scroll back where it was.
    const scrollBefore = window.scrollY;
    const restoreScroll = () => window.scrollTo(0, scrollBefore);
    player.playVideoAt(idx);
    requestAnimationFrame(restoreScroll);
    [60, 200, 600, 1200].forEach(ms => setTimeout(restoreScroll, ms));
    setStatus('🎶 Playing a random song from your playlist.', 'good');
    primed = true;
  }

  // Chrome only allows unprompted audio once a site has earned enough playback
  // history, so a page-load song can be silently blocked. Detect that and arm
  // the next click to start it instead of failing quietly.
  function playRandomSongOnLoad() {
    playRandomSong();
    setTimeout(() => {
      let state = -1;
      try { state = player.getPlayerState(); } catch (e) {}
      if (state === YT.PlayerState.PLAYING || state === YT.PlayerState.BUFFERING) return;
      setStatus('Click anywhere to play a random song.');
      const startOnGesture = () => {
        document.removeEventListener('click', startOnGesture);
        document.removeEventListener('keydown', startOnGesture);
        playRandomSong();
      };
      document.addEventListener('click', startOnGesture);
      document.addEventListener('keydown', startOnGesture);
    }, 2000);
  }

  testBtn.addEventListener('click', () => {
    primeAutoplay(() => playRandomSong());
  });

  skipBtn.addEventListener('click', () => playRandomSong());

  // Chrome throttles timers in background tabs, so a fired callback proves nothing
  // about how much time passed. Every check re-reads the wall clock instead.
  function tick() {
    updateClock();
    if (running && currentRemainingMs() <= 0) fireAlarm();
  }

  function fireAlarm() {
    clearTimers();
    running = false;
    endTime = null;
    remainingMs = 0;
    startBtn.textContent = 'Start';
    updateClock();
    stopKeepAlive();
    setStatus("Time's up!");
    notifyTimeUp();
    playRandomSong();
  }

  function clearTimers() {
    clearInterval(intervalId);
    clearTimeout(alarmId);
    intervalId = null;
    alarmId = null;
  }

  function scheduleTimers() {
    clearTimers();
    intervalId = setInterval(tick, 250);
    alarmId = setTimeout(tick, currentRemainingMs());
  }

  // Android freezes backgrounded pages, which would stop the countdown dead when
  // the screen locks. A page with a real <audio> element playing is treated as an
  // active media session and keeps running, so the alarm still fires on time.
  // The clip is a 50 Hz tone at about -40 dBFS: below what a phone speaker can
  // reproduce, but not digital silence, which the browser would ignore.
  function startKeepAlive() {
    try {
      keepAliveAudio.volume = 1;
      const played = keepAliveAudio.play();
      if (played && played.catch) played.catch(() => {});
      if ('mediaSession' in navigator) {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: 'Timer running',
          artist: 'Not quite my timer...',
          artwork: [{ src: 'icon-512.png', sizes: '512x512', type: 'image/png' }]
        });
        navigator.mediaSession.playbackState = 'playing';
        navigator.mediaSession.setActionHandler('pause', () => pauseTimer());
        navigator.mediaSession.setActionHandler('play', () => startTimer());
      }
    } catch (e) {}
  }

  function stopKeepAlive() {
    try {
      keepAliveAudio.pause();
      keepAliveAudio.currentTime = 0;
      if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'none';
    } catch (e) {}
  }

  // If the phone is locked or you're in another app, the song alone is easy to
  // miss, so the alarm also raises a real system notification.
  function notifyTimeUp() {
    try {
      if (!('Notification' in window) || Notification.permission !== 'granted') return;
      const opts = {
        body: 'Playing a random song from your playlist.',
        icon: 'icon-192.png',
        badge: 'icon-192.png',
        vibrate: [200, 100, 200, 100, 400],
        tag: 'nqmt-timeup',
        renotify: true,
        requireInteraction: true
      };
      if (navigator.serviceWorker && navigator.serviceWorker.ready) {
        navigator.serviceWorker.ready
          .then((reg) => reg.showNotification("Time's up", opts))
          .catch(() => { new Notification("Time's up", opts); });
      } else {
        new Notification("Time's up", opts);
      }
    } catch (e) {}
  }

  function startTimer() {
    if (running) return;
    let ms = currentRemainingMs();
    if (ms <= 0) ms = readDurationFromInputs() * 1000;
    if (ms <= 0) {
      setStatus('Set a duration above 0 first.', 'error');
      return;
    }
    endTime = Date.now() + ms;
    running = true;
    startBtn.textContent = 'Pause';
    primeAutoplay();
    startKeepAlive();
    // Asked here because Start is a user gesture, which the permission prompt needs.
    if ('Notification' in window && Notification.permission === 'default') {
      Notification.requestPermission().catch(() => {});
    }
    scheduleTimers();
    updateClock();
  }

  function pauseTimer() {
    if (!running) return;
    remainingMs = currentRemainingMs();
    running = false;
    endTime = null;
    clearTimers();
    stopKeepAlive();
    startBtn.textContent = 'Start';
    updateClock();
  }

  function stopTimer() {
    running = false;
    endTime = null;
    clearTimers();
    stopKeepAlive();
    startBtn.textContent = 'Start';
  }

  // Coming back to the tab re-reads the clock immediately, so a throttled
  // countdown snaps to the correct value instead of showing a stale one.
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) tick();
  });
  window.addEventListener('focus', tick);

  startBtn.addEventListener('click', () => {
    if (running) pauseTimer();
    else startTimer();
  });

  resetBtn.addEventListener('click', () => {
    stopTimer();
    remainingMs = readDurationFromInputs() * 1000;
    updateClock();
    setStatus('Timer reset.');
  });

  remainingMs = readDurationFromInputs() * 1000;
  updateClock();

  const tag = document.createElement('script');
  tag.src = 'https://www.youtube.com/iframe_api';
  document.body.appendChild(tag);

  // Installable as an app on Android; the worker only caches the shell so the
  // page still opens without a connection.
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
})();
</script>

</body>
</html>
